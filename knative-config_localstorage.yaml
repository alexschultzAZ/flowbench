apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vidsplit
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/min-scale: '1'
        autoscaling.knative.dev/target: '20'
    spec:
      containers:
      - env:
        - name: NEXT_URL
          value: http://modect.default.svc.cluster.local
        - name: OUTPUTBUCKET
          value: stage1
        - name: write_debug
          value: 'True'
        - name: STORAGE_TYPE
          value: local
        - name: MOUNT_PATH
          value: /mnt/local-storage
        - name: MN_FS
          value: 'False'
        - name: ENDPOINTINPUT
          value: 172.17.0.1:9000
        - name: PUSHGATEWAY_IP
          value: prom-pushgateway.default.svc.cluster.local:9091
        image: flowbench2024/kn-vidsplit-stateless
        volumeMounts:
            - name: my-volume
              mountPath: /mnt/local-storage
              readOnly: false
      volumes:
        - name: my-volume
          persistentVolumeClaim:
            claimName: local-storage-claim
            readOnly: false
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: modect
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/min-scale: '1'
        autoscaling.knative.dev/target: '20'
    spec:
      containers:
      - env:
        - name: NEXT_URL
          value: http://facextract.default.svc.cluster.local
        - name: OUTPUTBUCKET
          value: stage2
        - name: STORAGE_TYPE
          value: local
        - name: MOUNT_PATH
          value: /mnt/local-storage
        - name: PIPELINE_STAGE
          value: '2'
        - name: MODECT_MIN_AREA
          value: '5'
        - name: MODECT_SKIP_RATE
          value: '5'
        - name: write_debug
          value: 'True'
        - name: MN_FS
          value: 'False'
        - name: ENDPOINTINPUT
          value: 172.17.0.1:9000
        - name: PUSHGATEWAY_IP
          value: prom-pushgateway.default.svc.cluster.local:9091
        image: flowbench2024/kn-modect-stateless
        volumeMounts:
            - name: my-volume
              mountPath: /mnt/local-storage
              readOnly: false
      volumes:
        - name: my-volume
          persistentVolumeClaim:
            claimName: local-storage-claim
            readOnly: false
---
