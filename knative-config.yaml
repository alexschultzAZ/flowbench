apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vidsplit
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/min-scale: '1'
        autoscaling.knative.dev/target: '20'
    spec:
      containers:
      - env:
        - name: OUTPUTBUCKET
          value: stage1
        - name: STORAGE_TYPE
          value: obj
        - name: ENDPOINTINPUT
          value: 192.168.1.111:9000
        image: flowbench2024/kn-vidsplit-stateless
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: modect
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/min-scale: '1'
        autoscaling.knative.dev/target: '20'
    spec:
      containers:
      - env:
        - name: NEXT_URL
          value: http://facextract.default.svc.cluster.local
        - name: OUTPUTBUCKET
          value: stage2
        - name: STORAGE_TYPE
          value: obj
        - name: MODECT_MIN_AREA
          value: '5'
        - name: MODECT_SKIP_RATE
          value: '5'
        - name: ENDPOINTINPUT
          value: 192.168.1.111:9000
        image: flowbench2024/kn-modect-stateless
---
