provider:
  name: knative


workflow_logic:
  name: pipeline

functions:

  va-monolith:
    name: va-monolith
    image: flowbench2024/va-monolith
    order: 1
    data:
      bucketName: "stage0"
      fileName: "test_01.mp4"
    environment:
      OUTPUTBUCKET1: stage1
      OUTPUTBUCKET2: stage2
      OUTPUTBUCKET3: stage3
      OUTPUTBUCKET4: stage4
      ENDPOINTINPUT: "192.168.1.111:9000"
      MODECT_MIN_AREA: 5
      MODECT_SKIP_RATE: 5
      ACCELERATION: cpu