provider:
  name: knative


workflow_logic:
  name: pipeline

functions:

  vidsplit:
    name: vidsplit
    image: flowbench2024/kn-vidsplit-stateless
    order: 1
    data:
      bucketName: "stage0"
      fileName: "test_01.mp4"
    environment:
      OUTPUTBUCKET: stage1
      STORAGE_TYPE: obj
      ENDPOINTINPUT: "192.168.1.111:9000"
   
  modect:
    name: modect
    order: 2
    image: flowbench2024/kn-modect-stateless
    environment:
      NEXT_URL: "http://facextract.default.svc.cluster.local"
      OUTPUTBUCKET: stage2
      STORAGE_TYPE: obj
      MODECT_MIN_AREA: 5
      MODECT_SKIP_RATE: 5
      ENDPOINTINPUT: "192.168.1.111:9000"

  facextract:
    name: facextract
    order: 3
    image: flowbench2024/kn-facextract-stateless
    environment:
      NEXT_URL: "http://facerec.default.svc.cluster.local"
      OUTPUTBUCKET: stage3
      STORAGE_TYPE: obj
      ENDPOINTINPUT: "192.168.1.111:9000"

  facerec:
    name: facerec
    order: 4
    image: flowbench2024/kn-facerec-stateless
    environment:
      OUTPUTBUCKET: stage4
      STORAGE_TYPE: obj
      ENDPOINTINPUT: "192.168.1.111:9000"